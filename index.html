<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Null-X-Team | Official Site</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --surface-color: #121212;
            --card-bg: #181818;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --orange-primary: #ff6600;
            --orange-bright: #ff8800;
            --orange-glow: rgba(255, 102, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fira Code', 'Segoe UI', Monaco, monospace, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Ambient Glowing Animated Background */
        body::before {
            content: "";
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 80vw;
            height: 60vh;
            background: radial-gradient(circle, var(--orange-glow) 0%, transparent 70%);
            z-index: -1;
            animation: pulseGlow 6s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.3; transform: translateX(-50%) scale(0.9); }
            100% { opacity: 0.8; transform: translateX(-50%) scale(1.1); }
        }

        /* Header & Title Animations */
        header {
            min-height: 45vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 3rem 1rem;
            border-bottom: 1px solid #222;
        }

        .title {
            font-size: 3.5rem;
            color: #ffffff;
            letter-spacing: 2px;
            animation: fadeInDown 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .title span {
            color: var(--orange-primary);
            display: inline-block;
            animation: textGlow 2.5s infinite alternate ease-in-out;
        }

        .subtitle {
            margin-top: 1rem;
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 600px;
            opacity: 0;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        /* Content Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .section-title {
            font-size: 2rem;
            color: var(--orange-primary);
            margin-bottom: 2.5rem;
            position: relative;
            display: inline-block;
            opacity: 0;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 0%;
            height: 3px;
            background: var(--orange-primary);
            box-shadow: 0 0 10px var(--orange-primary);
            animation: expandWidth 1s ease-in-out 0.8s forwards;
        }

        /* Animated Grid Cards */
        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        .repo-card {
            background-color: var(--card-bg);
            border: 1px solid #2b2b2b;
            border-radius: 10px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
            transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        /* Light sweep shine animation across card */
        .repo-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 102, 0, 0.15), transparent);
            transition: left 0.6s ease;
        }

        .repo-card:hover::before {
            left: 100%;
        }

        .repo-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--orange-primary);
            box-shadow: 0 10px 25px rgba(255, 102, 0, 0.25);
        }

        .repo-card h3 {
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 0.8rem;
        }

        .repo-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
        }

        /* Interactive Animated Buttons */
        .btn {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            color: var(--orange-primary);
            border: 2px solid var(--orange-primary);
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            position: relative;
            z-index: 1;
            overflow: hidden;
            transition: color 0.3s ease;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background-color: var(--orange-primary);
            z-index: -1;
            transition: width 0.3s ease;
        }

        .btn:hover::after {
            width: 100%;
        }

        .btn:hover {
            color: #000000;
            box-shadow: 0 0 12px var(--orange-glow);
        }

        /* Animation Definitions */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes expandWidth {
            to { width: 100%; }
        }

        @keyframes textGlow {
            0% { text-shadow: 0 0 8px var(--orange-glow); }
            100% { text-shadow: 0 0 25px var(--orange-bright), 0 0 35px var(--orange-primary); }
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2.5rem;
            background-color: var(--surface-color);
            color: var(--text-secondary);
            border-top: 1px solid #222;
        }

        footer a {
            color: var(--orange-primary);
            text-decoration: none;
            transition: color 0.3s;
        }

        footer a:hover {
            color: var(--orange-bright);
            text-shadow: 0 0 8px var(--orange-glow);
        }
    </style>
</head>
<body>

    <header>
        <h1 class="title"><span>Null</span>-X-Team</h1>
        <p class="subtitle">Official GitHub Organization Portal</p>
    </header>

    <div class="container">
        <h2 class="section-title">Repositories</h2>
        
        <div class="repo-grid">
            <div class="repo-card">
                <h3>Dead Signal</h3>
                <p>Zombie shooter maintained by Null-X-Team.</p>
                <a href="https://github.com/Null-X-Team/DeadSignal" target="_blank" class="btn">View Repository</a>
            </div>

            <div class="repo-card">
                <h3>Null-X-Team.github.io</h3>
                <p>UBG site built by the Null-X-Team</p>
                <a href="https://github.com/Null-X-Team/Null-X-Team.github.io" target="_blank" class="btn">View Source</a>
            </div>
        </div>
    </div>

    <footer>
        <p>Explore more on <a href="https://github.com/Null-X-Team" target="_blank">GitHub</a></p>
    </footer>

</body>
</html>
